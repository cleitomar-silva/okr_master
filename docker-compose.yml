services:
  mysql:
    image: mysql:9.0.1
    container_name: okr-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: okr_master
      MYSQL_USER: okr
      MYSQL_PASSWORD: okrpass
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build: ./backend
    container_name: okr-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "9192:9192"
    volumes:
      - ./backend:/app
      - okr_storage:/app/storage
      - okr_vendor:/app/vendor
    working_dir: /app
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      APP_URL: http://localhost:9192
    command: >
      sh -c "php artisan serve --host=0.0.0.0 --port=9192"

  frontend:
    build: ./frontend
    container_name: okr-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5176:5176"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:9192
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5176"]

volumes:
  mysql_data:
  okr_storage:
  okr_vendor: